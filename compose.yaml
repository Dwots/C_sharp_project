services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamelib_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=gamelibdb;Username=gameuser;Password=gamepass
      - ConnectionStrings__ReplicaConnection=Host=postgres_replica;Port=5432;Database=gamelibdb;Username=gameuser;Password=gamepass
      # Шарды (лабораторная №5): три независимых PostgreSQL.
      - Sharding__Shards__0=Host=shard0;Port=5432;Database=shard;Username=gameuser;Password=gamepass
      - Sharding__Shards__1=Host=shard1;Port=5432;Database=shard;Username=gameuser;Password=gamepass
      - Sharding__Shards__2=Host=shard2;Port=5432;Database=shard;Username=gameuser;Password=gamepass
      - ConnectionStrings__Redis=redis:6379
      - AuthSettings__SecretKey=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      # Алертинг партиций (лабораторная №3). Значения берутся из .env в корне
      # проекта; если файла нет, переменные пустые и алерты просто пишутся в лог.
      - Alerting__Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Alerting__Telegram__ChatId=${TELEGRAM_CHAT_ID:-}
    # DNS хоста отдаёт api.telegram.org через локальный туннель (fc00::b),
    # который контейнеру недоступен. Публичные резолверы возвращают реальные
    # адреса, и до них контейнер достукивается напрямую.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      liquibase:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    container_name: gamelib_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: gamelibdb
    ports:
      - "5434:5432"
    # Docker по умолчанию даёт контейнеру 64 МБ /dev/shm. PostgreSQL использует
    # этот раздел для обмена между параллельными процессами, и на таблицах в
    # миллионы строк воркеры падают с "could not resize shared memory segment".
    shm_size: 1gb
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/replication/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d gamelibdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_replica:
    image: postgres:16-alpine
    container_name: gamelib_db_replica
    restart: unless-stopped
    user: postgres
    environment:
      PGPASSWORD: replpass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5435:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c '
      if [ ! -s "$$PGDATA/PG_VERSION" ]; then
        echo "Replica: копии нет, снимаю с Primary...";
        rm -rf "$$PGDATA"/*;
        until pg_basebackup -h postgres -p 5432 -U replicator -D "$$PGDATA" -Fp -Xs -R -P; do
          echo "Replica: Primary ещё не готов, повтор через 3 с...";
          sleep 3;
        done;
        chmod 0700 "$$PGDATA";
      fi;
      exec postgres -c hot_standby=on
      '

  # === ШАРДЫ (лабораторная №5) ===
  # Три независимых PostgreSQL. Каждый хранит свою долю play_sessions;
  # общих данных между ними нет, реплики друг другу они не являются.
  shard0:
    image: postgres:16-alpine
    container_name: gamelib_shard0
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: shard
    ports:
      - "5441:5432"
    volumes:
      - shard0_data:/var/lib/postgresql/data
      - ./db/sharding/init-shard.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d shard"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard1:
    image: postgres:16-alpine
    container_name: gamelib_shard1
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: shard
    ports:
      - "5442:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./db/sharding/init-shard.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d shard"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard2:
    image: postgres:16-alpine
    container_name: gamelib_shard2
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: shard
    ports:
      - "5443:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
      - ./db/sharding/init-shard.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d shard"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.29-alpine
    container_name: gamelib_liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/liquibase/db
    command:
      - --searchPath=/liquibase/db
      - --changeLogFile=changelog.xml
      - --url=jdbc:postgresql://postgres:5432/gamelibdb
      - --username=gameuser
      - --password=gamepass
      - update

  redis:
    image: redis:alpine
    container_name: gamelib_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # === PGADMIN ===
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gamelib_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamelib.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Не спрашивать мастер-пароль при каждом входе
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Сервер gamelib подключается автоматически, вручную добавлять не нужно
      - ./monitoring/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Чтобы Query Tool видел .sql проекта через Ctrl+O. Файловый диалог
      # pgAdmin заперт в storage-каталоге пользователя, поэтому монтируем
      # именно туда: admin@gamelib.com -> admin_gamelib.com
      - ./docs:/var/lib/pgadmin/storage/admin_gamelib.com/docs:ro
      - ./db:/var/lib/pgadmin/storage/admin_gamelib.com/db:ro
    depends_on:
      postgres:
        condition: service_healthy

  # === PROMETHEUS ===
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: gamelib_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # === GRAFANA ===
  grafana:
    image: grafana/grafana:10.3.3
    container_name: gamelib_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  postgres_replica_data:
  shard0_data:
  shard1_data:
  shard2_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
