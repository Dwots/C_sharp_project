# Правила аутентификации PostgreSQL (лабораторная №4).
#
# Копия того, что образ postgres:16-alpine создаёт по умолчанию, плюс одна
# добавленная строка — разрешение репликации из сети Docker.
#
# Подключается параметром -c hba_file=... в compose.yaml. Файл, лежащий
# в проекте, а не внутри тома с данными, попадает в репозиторий: у любого,
# кто поднимет проект, репликация заработает без ручных правок.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- то, что было в образе по умолчанию ---
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# --- ДОБАВЛЕНО для лабораторной №4 ---
# Псевдобаза "replication" — не настоящая БД, а признак того, что клиент
# подключается по протоколу репликации, а не за данными.
# Адрес "all", потому что IP контейнера Replica заранее неизвестен.
# scram-sha-256, а не trust: анонимную репликацию не разрешаем.
host    replication     replicator      all                     scram-sha-256

# --- обычные подключения: API, pgAdmin, psql с хоста ---
host    all             all             all                     scram-sha-256
